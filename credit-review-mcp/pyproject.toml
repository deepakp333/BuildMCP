[project]
name = "credit-review-mcp"
version = "0.1.0"
description = "Demo MCP server for credit analyst GenAI proof of concept"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Credit Review Demo" }]
dependencies = [
    "mcp>=1.6.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "yfinance>=0.2.50",
    "anthropic>=0.42.0",
    "reportlab>=4.2.0",
    "streamlit>=1.41.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[project.scripts]
credit-review-mcp = "credit_review_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_review_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/credit_review_mcp", "sample_data", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.format]
quote-style = "double"
