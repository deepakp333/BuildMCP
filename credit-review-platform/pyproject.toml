[project]
name = "credit-review-platform"
version = "0.1.0"
description = "Credit Review Platform with MCP server, FastAPI, and React"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "mcp>=1.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "scipy>=1.14.0",
  "rapidfuzz>=3.10.0",
  "structlog>=24.4.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.12",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
